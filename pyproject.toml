# Nelo — le projet racine installable.
#
# Un seul projet Python installé (`modules` et `api`), et un espace de travail `uv` dont chaque
# paquet est membre déclaratif : il n'est pas installé, mais il déclare ses dépendances internes.
# C'est ce qui donne au premier verrou de P-11 quelque chose à inspecter (research.md R-03).

[project]
name = "nelo"
version = "0.1.0"
description = "Nelo — plateforme de gestion pour établissements scolaires"
requires-python = "==3.14.*"
dependencies = [
    "fastapi==0.141.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "uvicorn==0.52.4",
    "sqlalchemy==2.0.52",
    "greenlet==3.5.6",
    "asyncpg==0.31.0",
    "alembic==1.19.2",
    "valkey==6.1.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
    "coverage==7.16.0",
    "ruff==0.16.6",
    "import-linter==2.15",
    "pip-licenses==5.5.5",
    "pyyaml==6.0.3",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["modules", "api"]

[tool.uv.workspace]
members = [
    "modules/shared",
    "modules/domaine",
    "modules/socle/tenants",
    "modules/socle/assistance",
    "modules/socle/communication",
    "modules/metier/protection",
    "modules/metier/finance",
    "api",
]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["contrat", ".specify", "ancien_docs", "docs", "specs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S608", "UP"]
# La longueur des lignes de code est tenue par `ruff format` ; les docstrings et chaînes longues restent lisibles.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["api", "modules", "scripts", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.coverage.run]
source = ["modules", "api"]
