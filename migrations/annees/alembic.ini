# Les migrations du module `annees` — un dossier par module (docs/01-stack.md § 4).
# L'URL vient de NELO_BD_URL_PROPRIETAIRE (et NELO_BD_NOM), jamais de ce fichier.
[alembic]
script_location = %(here)s
prepend_sys_path = %(here)s/../..
version_table_schema = annees
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = WARNING
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
